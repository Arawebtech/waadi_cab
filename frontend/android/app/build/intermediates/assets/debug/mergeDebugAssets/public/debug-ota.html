<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTA Update Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">OTA Update Debug</h1>
            <p class="text-gray-600 mb-4">Test your OTA update system</p>
            
            <div class="space-y-4">
                <button
                    id="checkUpdates"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2"
                >
                    <i data-lucide="refresh-cw" class="h-5 w-5"></i>
                    Check for Updates
                </button>
                
                <button
                    id="testAPI"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2"
                >
                    <i data-lucide="globe" class="h-5 w-5"></i>
                    Test API Directly
                </button>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Debug Info</h2>
            <div id="debugInfo" class="space-y-2 text-sm">
                <div>Platform: <span id="platform">Loading...</span></div>
                <div>User Agent: <span id="userAgent" class="break-all"></span></div>
                <div>Current URL: <span id="currentUrl" class="break-all"></span></div>
                <div>Timestamp: <span id="timestamp"></span></div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">API Response</h2>
            <div id="apiResponse" class="bg-gray-100 p-4 rounded-lg">
                <p class="text-gray-500">No API call made yet</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mt-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Console Logs</h2>
            <div id="consoleLogs" class="bg-black text-green-400 p-4 rounded-lg font-mono text-sm max-h-64 overflow-y-auto">
                <div>Console logs will appear here...</div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Debug info
        document.getElementById('platform').textContent = navigator.platform;
        document.getElementById('userAgent').textContent = navigator.userAgent;
        document.getElementById('currentUrl').textContent = window.location.href;
        document.getElementById('timestamp').textContent = new Date().toISOString();

        // Console logging override
        const originalLog = console.log;
        const originalError = console.error;
        const consoleDiv = document.getElementById('consoleLogs');

        function addToConsole(message, type = 'log') {
            const div = document.createElement('div');
            div.className = type === 'error' ? 'text-red-400' : 'text-green-400';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole(args.join(' '));
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole(args.join(' '), 'error');
        };

        // Check for updates button
        document.getElementById('checkUpdates').addEventListener('click', async () => {
            console.log('🔍 Checking for updates...');
            
            try {
                const response = await fetch('https://api.waadi.in/api/v1/check?currentVersion=1.1.2&platform=android');
                const data = await response.json();
                
                console.log('📱 API Response:', JSON.stringify(data, null, 2));
                
                document.getElementById('apiResponse').innerHTML = `
                    <pre class="text-sm">${JSON.stringify(data, null, 2)}</pre>
                `;
                
                if (data.success && data.data.updateRequired) {
                    console.log('✅ Update required!');
                    console.log('📱 Latest version:', data.data.latestVersion);
                    console.log('📱 Download URL:', data.data.downloadUrl);
                    console.log('📱 Forced:', data.data.isForced);
                    
                    // Show update notification
                    if (data.data.isForced) {
                        alert('🚨 FORCED UPDATE REQUIRED!\n\nVersion: ' + data.data.latestVersion + '\n\n' + data.data.releaseNotes);
                    } else {
                        alert('📱 Update Available!\n\nVersion: ' + data.data.latestVersion + '\n\n' + data.data.releaseNotes);
                    }
                } else {
                    console.log('✅ No update required');
                    alert('✅ App is up to date!');
                }
            } catch (error) {
                console.error('❌ Error checking updates:', error);
                alert('❌ Error: ' + error.message);
            }
        });

        // Test API directly button
        document.getElementById('testAPI').addEventListener('click', async () => {
            console.log('🌐 Testing API directly...');
            
            const testCases = [
                { version: '1.1.2', platform: 'android' },
                { version: '1.1.1', platform: 'android' },
                { version: '1.1.2', platform: 'ios' },
                { version: '1.0.0', platform: 'both' }
            ];
            
            for (const test of testCases) {
                try {
                    console.log(`🧪 Testing: version=${test.version}, platform=${test.platform}`);
                    const response = await fetch(` https://api.waadi.in/api/v1/check?currentVersion=${test.version}&platform=${test.platform}`);
                    const data = await response.json();
                    console.log(`📊 Result:`, data);
                } catch (error) {
                    console.error(`❌ Error testing ${test.version}:`, error);
                }
            }
        });

        // Initial log
        console.log('🚀 OTA Debug page loaded');
        console.log('📱 Platform detected:', navigator.platform);
        console.log('🌐 User agent:', navigator.userAgent);
    </script>
</body>
</html>
