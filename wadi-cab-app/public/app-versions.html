<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Versions - Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">App Versions Upload</h1>
            <p class="text-gray-600">Upload your app builds for OTA updates - No authentication required!</p>
        </div>

        <!-- Upload Form -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Create New Version</h2>
            
            <form id="uploadForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="version" class="block text-sm font-medium text-gray-700 mb-2">
                            Version Number *
                        </label>
                        <input
                            type="text"
                            id="version"
                            name="version"
                            required
                            placeholder="e.g., 1.0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                    </div>
                    
                    <div>
                        <label for="platform" class="block text-sm font-medium text-gray-700 mb-2">
                            Platform *
                        </label>
                        <select 
                            id="platform"
                            name="platform"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                            <option value="android">Android</option>
                            <option value="ios">iOS</option>
                            <option value="both" selected>Both Platforms</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="releaseNotes" class="block text-sm font-medium text-gray-700 mb-2">
                        Release Notes *
                    </label>
                    <textarea
                        id="releaseNotes"
                        name="releaseNotes"
                        required
                        rows="4"
                        placeholder="Describe what's new in this version..."
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    ></textarea>
                </div>

                <div>
                    <label for="buildFile" class="block text-sm font-medium text-gray-700 mb-2">
                        Build File (ZIP) *
                    </label>
                    <input
                        type="file"
                        id="buildFile"
                        name="buildFile"
                        accept=".zip"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <p class="text-sm text-gray-500 mt-1">
                        Upload a ZIP file containing your app build (max 100MB)
                    </p>
                </div>

                <div class="flex items-center space-x-6">
                    <div class="flex items-center space-x-2">
                        <input
                            type="checkbox"
                            id="isActive"
                            name="isActive"
                            checked
                            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                        />
                        <label for="isActive" class="text-sm font-medium text-gray-700">
                            Active (make available for updates)
                        </label>
                    </div>
                    
                    <div class="flex items-center space-x-2">
                        <input
                            type="checkbox"
                            id="isForced"
                            name="isForced"
                            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                        />
                        <label for="isForced" class="text-sm font-medium text-gray-700">
                            Forced Update (users must update)
                        </label>
                    </div>
                </div>

                <div>
                    <label for="minSupportedVersion" class="block text-sm font-medium text-gray-700 mb-2">
                        Minimum Supported Version
                    </label>
                    <input
                        type="text"
                        id="minSupportedVersion"
                        name="minSupportedVersion"
                        placeholder="e.g., 1.0.0"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center gap-2"
                >
                    <i data-lucide="upload" class="h-5 w-5"></i>
                    Upload Version
                </button>
            </form>
        </div>

        <!-- Current Versions -->
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-900">Current Versions</h2>
                <button
                    id="refreshBtn"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg flex items-center gap-2"
                >
                    <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                    Refresh
                </button>
            </div>
            
            <div id="versionsList" class="space-y-4">
                <div class="text-center py-8">
                    <i data-lucide="loader-2" class="h-8 w-8 animate-spin text-blue-600 mx-auto mb-2"></i>
                    <p>Loading versions...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Load versions on page load
        loadVersions();

        // Handle form submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            
            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="h-5 w-5 animate-spin"></i> Uploading...';
                lucide.createIcons();

                const formData = new FormData(e.target);
                
                const response = await fetch('http://localhost:4001/api/v1/admin/app-versions', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    alert('Version uploaded successfully!');
                    e.target.reset();
                    loadVersions();
                } else {
                    alert('Error: ' + (result.message || 'Failed to upload version'));
                }
            } catch (error) {
                console.error('Upload error:', error);
                alert('Error uploading version: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
                lucide.createIcons();
            }
        });

        // Handle refresh button
        document.getElementById('refreshBtn').addEventListener('click', loadVersions);

        // Load versions function
        async function loadVersions() {
            const versionsList = document.getElementById('versionsList');
            
            try {
                versionsList.innerHTML = `
                    <div class="text-center py-8">
                        <i data-lucide="loader-2" class="h-8 w-8 animate-spin text-blue-600 mx-auto mb-2"></i>
                        <p>Loading versions...</p>
                    </div>
                `;
                lucide.createIcons();

                const response = await fetch('http://localhost:4001/api/v1/admin/app-versions');
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    versionsList.innerHTML = result.data.map(version => `
                        <div class="border rounded-lg p-4 hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-2">
                                        <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium">
                                            v${version.version}
                                        </span>
                                        <span class="px-2 py-1 rounded-full text-xs font-medium ${
                                            version.isActive 
                                                ? 'bg-green-100 text-green-800' 
                                                : 'bg-gray-100 text-gray-800'
                                        }">
                                            ${version.isActive ? 'Active' : 'Inactive'}
                                        </span>
                                        ${version.isForced ? '<span class="bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs font-medium">Forced</span>' : ''}
                                    </div>
                                    <p class="text-gray-700 mb-2">${version.releaseNotes}</p>
                                    <div class="flex items-center gap-4 text-sm text-gray-500">
                                        <span><i data-lucide="calendar" class="h-4 w-4 inline mr-1"></i>${new Date(version.createdAt).toLocaleDateString()}</span>
                                        <span><i data-lucide="smartphone" class="h-4 w-4 inline mr-1"></i>${version.platform}</span>
                                        ${version.fileSize ? `<span><i data-lucide="package" class="h-4 w-4 inline mr-1"></i>${formatFileSize(version.fileSize)}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    versionsList.innerHTML = `
                        <div class="text-center py-8">
                            <i data-lucide="package" class="h-12 w-12 text-gray-400 mx-auto mb-4"></i>
                            <h3 class="text-lg font-medium text-gray-900 mb-2">No versions found</h3>
                            <p class="text-gray-600">Upload your first app version above</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading versions:', error);
                versionsList.innerHTML = `
                    <div class="text-center py-8">
                        <i data-lucide="alert-circle" class="h-12 w-12 text-red-400 mx-auto mb-4"></i>
                        <h3 class="text-lg font-medium text-gray-900 mb-2">Error loading versions</h3>
                        <p class="text-gray-600">${error.message}</p>
                    </div>
                `;
            }
            
            lucide.createIcons();
        }

        // Format file size helper
        function formatFileSize(bytes) {
            if (!bytes) return 'Unknown';
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }
    </script>
</body>
</html>
